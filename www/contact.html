<section class="hero">
	<!-- <p class="kicker">Contact</p> -->
	<h1>Tell k<span>42</span>s what you <span>need</span>.</h1>

  <form id="contactForm" class="form-wrap" novalidate>
    <div class="field">
      <label for="cf-name">Name</label>
      <input id="cf-name" name="name" type="text" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="cf-email">Email</label>
      <input id="cf-email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="cf-message">What do you need help with?</label>
      <textarea id="cf-message" name="message" rows="5" placeholder='e.g. "migrate our CI to GitLab"' required></textarea>
    </div>

    <button type="submit" class="submit-btn">Send request</button>
    <p id="formStatus" class="form-status" aria-live="polite"></p>
  </form>


</section>
